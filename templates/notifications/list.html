{% extends 'base.html' %}{% block content %}<div class="container narrow py-5"><span class="section-kicker">Stay updated</span><h1>Notifications</h1><div class="form-card p-0 mt-4">{% for notification in notifications %}<a class="notification-item {% if not notification.is_read %}unread{% endif %}" {% if notification.link %}href="{{ notification.link }}"{% endif %}><i class="bi bi-bell-fill"></i><div class="ms-3"><b>{{ notification.title }}</b><p class="mb-0">{{ notification.message }}</p><small>{{ notification.created_at|timesince }} ago</small></div></a>{% empty %}<div class="empty-state"><i class="bi bi-bell"></i><h4>You’re all caught up.</h4></div>{% endfor %}</div></div>{% endblock %}
